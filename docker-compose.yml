version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.5-alpine
    container_name: pleaco_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pleaco-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    command: sh -c "redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pleaco-network

  # redis-insight:
  #   image: redis/redisinsight:latest
  #   container_name: redis-insight
  #   ports:
  #     - "5540:5540"
  #   depends_on:
  #     - redis
  #   networks:
  #     - pleaco-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pleaco_rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/policies.json:/etc/rabbitmq/pleaco-policies.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pleaco-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pleaco_mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - pleaco-network

  db-migrate:
    build: .
    command: sh /app/scripts/provision-db.sh
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pleaco-network

  api:
    build: .
    container_name: pleaco_api
    command: python /app/scripts/start-api.py
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    ports:
      - "8000:8000"
    environment:
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - APP_DB_NAME=${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${ACCESS_TOKEN_EXPIRE_SECONDS}
      - REFRESH_TOKEN_EXPIRE_SECONDS=${REFRESH_TOKEN_EXPIRE_SECONDS:-604800}
      - APP_ENV=${APP_ENV:-dev}
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_URL=${API_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_PUBLIC_BASE_URL=${EMAIL_PUBLIC_BASE_URL:-}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-[]}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - OTP_CODE_EXPIRE_SECONDS=${OTP_CODE_EXPIRE_SECONDS:-600}
      - INVITATION_EXPIRE_SECONDS=${INVITATION_EXPIRE_SECONDS:-604800}
      - INVITATION_EXPIRY_SWEEP_INTERVAL_SECONDS=${INVITATION_EXPIRY_SWEEP_INTERVAL_SECONDS:-60}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GOOGLE_FRONTEND_REDIRECT_URI=${GOOGLE_FRONTEND_REDIRECT_URI:-http://localhost:3000}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - HEARTBEAT_REDIS_TTL_SECONDS=${HEARTBEAT_REDIS_TTL_SECONDS:-60}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_CONNECT_TIMEOUT=${RABBITMQ_CONNECT_TIMEOUT:-10}
      - RABBITMQ_MAX_RETRIES=${RABBITMQ_MAX_RETRIES:-3}
      - RABBITMQ_PUBLISH_TIMEOUT=${RABBITMQ_PUBLISH_TIMEOUT:-10}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - ROBOT_COMMAND_TIMEOUT_SECONDS=${ROBOT_COMMAND_TIMEOUT_SECONDS:-60}
      - ROBOT_COMMANDS_PAUSED=${ROBOT_COMMANDS_PAUSED:-false}
      - CLEANING_PATH_CLEARANCE_METERS=${CLEANING_PATH_CLEARANCE_METERS:-1.0}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - pleaco-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis-data:
    driver: local

networks:
  pleaco-network:
    driver: bridge
